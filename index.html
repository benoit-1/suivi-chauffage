<!DOCTYPE html>
<!-- Suivi pellets, version 2.1 du 9 novembre 2026 -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#d9611a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pellets">
<title>Suivi pellets</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Accueil ludique : gros chiffres colorés (froid = bleu, maison = braise), deux grands boutons d'action, détails à part. */
:root{
  --bg:#eef0f3;--surface:#ffffff;--ink:#1b212c;--muted:#5a6372;--line:#d9dde4;
  --accent:#d9611a;--accent-soft:#fbe7da;--accent-ink:#ffffff;--warm:#b8420c;
  --cold:#2b6cb0;--cold-soft:#e1ecf8;--good:#2c8653;--bad:#bf3d31;--night:#1b212c;--night-ink:#ffffff;--snow:#6b98d0;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111419;--surface:#1a1f27;--ink:#e7eaf0;--muted:#98a1b0;--line:#2b323d;
  --accent:#f0873a;--accent-soft:#3a2516;--accent-ink:#1a1006;--warm:#ffb07a;
  --cold:#6aa8ea;--cold-soft:#16263a;--good:#4db37a;--bad:#e46a5e;--night:#000000;--night-ink:#ffffff;--snow:#cfe0f5;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111419;--surface:#1a1f27;--ink:#e7eaf0;--muted:#98a1b0;--line:#2b323d;
  --accent:#f0873a;--accent-soft:#3a2516;--accent-ink:#1a1006;--warm:#ffb07a;
  --cold:#6aa8ea;--cold-soft:#16263a;--good:#4db37a;--bad:#e46a5e;--night:#000000;--night-ink:#ffffff;--snow:#cfe0f5;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:linear-gradient(180deg,var(--cold-soft) 0%,var(--bg) 38%,var(--bg) 70%,var(--accent-soft) 100%) fixed var(--bg);min-height:100vh;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 28px;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:700;font-size:1.55rem;line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:0;text-wrap:balance}
.sub{font-size:.88rem;color:var(--muted);margin:2px 0 0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.demo{background:var(--cold-soft);color:var(--cold);font-size:.8rem;border-radius:10px;padding:6px 10px;text-align:center}
.lnk{background:none;border:none;padding:0;color:var(--accent);text-decoration:underline;font-weight:600}
/* barre */
.top{display:flex;justify-content:space-between;align-items:flex-start}
.gear{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:1.4rem;line-height:1}
.hbar{display:flex;align-items:center;gap:10px}
.back{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:1.3rem;flex:none}
/* gros chiffres */
.big2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.t{border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.t .l{font-size:.88rem;font-weight:600}
.t .v{font-family:var(--display);font-weight:800;font-size:2.7rem;line-height:1.05;font-variant-numeric:tabular-nums}
.t .v small{font-size:1.1rem;font-weight:700;margin-left:1px}
.t .n{font-size:.78rem;opacity:.85}
.t.ext{background:var(--cold-soft);color:var(--cold)}
.t.int{background:var(--accent-soft);color:var(--warm)}
.t.sacs{grid-column:1/3;background:var(--night);color:var(--night-ink);flex-direction:row;align-items:center;justify-content:space-between}
.t.sacs .v{font-size:3.2rem}
.row-b{display:flex;align-items:baseline;gap:10px}
.flame{font-size:2.6rem}
@media (prefers-reduced-motion:no-preference){.flame{animation:flicker 2.6s ease-in-out infinite;display:inline-block;transform-origin:50% 90%}
  @keyframes flicker{0%,100%{transform:scale(1) rotate(0)}40%{transform:scale(1.06) rotate(-3deg)}70%{transform:scale(.97) rotate(2deg)}}
  .pop{animation:pop .45s ease}@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}}
/* boutons d'action */
.acts{display:flex;flex-direction:column;gap:12px}
.act{border:none;border-radius:20px;padding:16px;display:flex;align-items:center;gap:14px;text-align:left;min-height:84px}
.act .ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:1.8rem;flex:none}
.act b{display:block;font-family:var(--display);font-size:1.22rem;line-height:1.2}
.act .s{font-size:.84rem;opacity:.85}
.a1{background:var(--surface);border:2px solid var(--cold)}.a1 .ic{background:var(--cold-soft)}
.a2{background:var(--accent);color:var(--accent-ink)}.a2 .ic{background:rgba(255,255,255,.22)}
.act:active{transform:scale(.98)}
.last{font-size:.86rem;color:var(--muted);text-align:center;margin:0}
.det{background:transparent;border:1.5px dashed var(--muted);border-radius:14px;padding:14px;font-weight:600;color:var(--muted);width:100%}
/* bienvenue */
.hero{text-align:center;padding-top:28px}
.logo{font-size:4rem;line-height:1}
.big-title{font-size:2.2rem}
.lead{color:var(--muted);margin:0 auto;max-width:34ch}
.perks{list-style:none;padding:0;margin:4px auto;display:flex;flex-direction:column;gap:8px;text-align:left;max-width:320px}
.perks li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stack{display:flex;flex-direction:column;gap:12px}
.btn-g,.btn-o{border-radius:14px;padding:14px;font-weight:600;font-size:1.02rem;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;gap:10px}
.btn-g{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gl{width:24px;height:24px;border-radius:50%;background:#fff;color:#4285f4;font-weight:800;display:grid;place-items:center;font-size:.9rem}
.small{font-size:.8rem;color:var(--muted)}
/* formulaires */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);flex:none;min-width:0}
.row>label.f{flex:1 1 140px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>button:not(.primary),.card button:not(.x):not(.lnk):not(.primary){border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px}
.primary{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:14px;padding:12px 16px;font-weight:600}
.primary.big{font-size:1.1rem;padding:16px}
.hint{font-size:.85rem;color:var(--muted);margin:0}
.center{text-align:center}
.empty{color:var(--muted);margin:0}
/* températures */
.room{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-height:68px}
.room.ro{background:var(--cold-soft);border-color:transparent}
.rn{font-weight:600;font-size:1.02rem}
.tag{font-size:.7rem;font-weight:600;color:var(--warm);background:var(--accent-soft);border-radius:999px;padding:1px 8px;vertical-align:2px}
.rin{display:flex;align-items:center;gap:6px}
.tin{width:96px;font-size:1.5rem;font-family:var(--display);font-weight:700;text-align:center;padding:8px}
.u{color:var(--muted);font-weight:600}
.cap{font-size:.9rem;color:var(--cold);font-weight:600}
/* chargement */
.counter{display:grid;grid-template-columns:72px minmax(150px,1fr) 72px;align-items:center;justify-items:center;gap:8px;padding:16px 0}
.pm{width:72px;height:72px;border-radius:50%;border:2px solid var(--accent);background:var(--surface);color:var(--accent);font-size:2.2rem;font-weight:700;line-height:1}
.cval{display:flex;flex-direction:column;align-items:center;gap:6px}
.cv{font-family:var(--display);font-weight:800;font-size:4rem;line-height:1;white-space:nowrap;color:var(--accent);font-variant-numeric:tabular-nums}
.cu{color:var(--muted);font-weight:600}
.chips{display:flex;justify-content:center;gap:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 18px;font-weight:600}
.fire{font-size:1.15rem}
/* détails */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column}
.tile .lab{font-size:.78rem;color:var(--muted)}
.tile .val{font-family:var(--display);font-weight:700;font-size:1.6rem;font-variant-numeric:tabular-nums}
.tile .val.ext{color:var(--cold)}
.tile .note{font-size:.76rem;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kv div{display:flex;flex-direction:column}.kv span{font-size:.8rem;color:var(--muted)}.kv b{font-variant-numeric:tabular-nums}
.chart{overflow:hidden}.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;font-size:.8rem;color:var(--muted)}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
table{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:500;color:var(--muted);font-size:.78rem;border-bottom:1px solid var(--line);padding:6px 5px}
td{border-bottom:1px solid var(--line);padding:7px 5px}
td.num,th.num{text-align:right}td.ext{color:var(--cold);font-weight:600}
.tablewrap{overflow-x:auto}.tablewrap td,.tablewrap th{white-space:nowrap}
.bar{display:block;height:8px;border-radius:4px;background:var(--accent);min-width:2px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:none;background:transparent;border-radius:9px;padding:8px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:.9rem}
.x{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--bad);flex:none;font-size:1.1rem;line-height:1}
.x:disabled{opacity:.35}
textarea{min-height:110px;font-size:.78rem;font-family:ui-monospace,Menlo,monospace}textarea.small{min-height:54px}
/* réglages */
.radios{display:flex;flex-direction:column;gap:8px}
.radio{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.radio input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--accent)}
.radio b{display:block}.radio .s{font-size:.84rem;color:var(--muted)}
.radio:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio.off{opacity:.6;cursor:default}
.soon{font-size:.7rem;font-weight:600;background:var(--cold-soft);color:var(--cold);border-radius:999px;padding:1px 8px;margin-left:4px;vertical-align:2px}
.pc{display:grid;grid-template-columns:minmax(0,1fr) 128px 34px;gap:8px;align-items:center}
.pc select{width:128px;font-size:.8rem;padding:9px 6px}
.confirm{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:.92rem}
.invite{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.qr{background:#fff;padding:8px;border-radius:12px;border:1px solid var(--line);width:190px;max-width:100%;flex:none}.qr svg{display:block;width:100%;height:auto}
.invtxt{flex:1 1 200px;display:flex;flex-direction:column;gap:8px}
/* toast + version */
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);opacity:0;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw;text-align:center;pointer-events:none;transition:opacity .25s,transform .25s;z-index:10}
#toast.on{opacity:1;transform:translate(-50%,0)}
.ver{text-align:center;font-size:.72rem;color:var(--muted);margin:0 0 24px}

/* fond animé */
#fond{position:fixed;inset:0;z-index:0;pointer-events:none;transition:opacity .6s ease}
#app,#toast,.ver{position:relative;z-index:1}
#toast{position:fixed}
.t.ext,.t.int{box-shadow:0 2px 10px rgba(20,30,50,.06)}
.act{box-shadow:0 4px 14px rgba(20,30,50,.08)}

.ic-p{font-size:1.4rem;line-height:1;flex:none}
/* version GitHub */
.hero .card.left{text-align:left}
details.card summary{cursor:pointer;font-weight:600;color:var(--accent)}
details.card[open] summary{margin-bottom:8px}
.errbox{background:var(--accent-soft);border-left:4px solid var(--bad);padding:8px 12px;border-radius:8px;margin:0;font-size:.9rem}
.sync{font-size:.78rem;color:var(--muted);margin:2px 0 0;display:flex;align-items:center;gap:6px;min-height:1em}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.ok{background:var(--good)}.dot.busy{background:#d69e2e}.dot.err{background:var(--bad)}
.card.install{border:2px solid var(--accent);background:var(--surface)}

/* animation forcée ou coupée par l'utilisateur */
html.anim-on .flame{animation:flicker 2.6s ease-in-out infinite;display:inline-block;transform-origin:50% 90%}
html.anim-off .flame{animation:none}
@keyframes flicker{0%,100%{transform:scale(1) rotate(0)}40%{transform:scale(1.08) rotate(-4deg)}70%{transform:scale(.96) rotate(3deg)}}
.f>span{font-size:.85rem;color:var(--muted)}

</style>
</head>

<script>
(function(){
"use strict";
/* ==================================================================
   Suivi pellets — version 2.0
   L'interface ne parle qu'à « Store » (données) et « Meteo » (météo).
   Données : un fichier JSON dans un dépôt GitHub privé. Météo : Open-Meteo.
   ================================================================== */
var VERSION='2.1', VERSION_DATE='9 novembre 2026';
var DEMO=false;
var BANDS=[{lab:'Moins de 0 °C',lo:-99,hi:0},{lab:'0 à 5 °C',lo:0,hi:5},{lab:'5 à 10 °C',lo:5,hi:10},{lab:'10 à 15 °C',lo:10,hi:15},{lab:'15 °C et plus',lo:15,hi:99}];
var EXT_SOURCES=[
  {id:'auto',lab:'Automatique',desc:'Météo de la commune, relevée heure par heure.'},
  {id:'manuel',lab:'Manuelle',desc:'Vous la notez à chaque relevé (thermomètre extérieur).'},
  {id:'les2',lab:'Les deux',desc:'Votre relevé s’il existe, sinon la météo automatique.'},
  {id:'capteur',lab:'Thermomètre connecté',desc:'SwitchBot, Netatmo, Home Assistant…',bientot:true}];

/* ---------- utilitaires ---------- */
function p2(n){return (n<10?'0':'')+n}
function ymd(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function dtStr(d){return ymd(d)+'T'+p2(d.getHours())+':'+p2(d.getMinutes())}
function nowDT(){return dtStr(new Date())}
function parseDT(s){var a=String(s).split(/[-T:]/);return new Date(+a[0],+a[1]-1,+a[2],+a[3]||0,+a[4]||0).getTime()}
var fDT=new Intl.DateTimeFormat('fr-FR',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
var fD=new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short'});
var fH=new Intl.DateTimeFormat('fr-FR',{hour:'2-digit',minute:'2-digit'});
function fdt(s){return fDT.format(new Date(parseDT(s)))}
function fds(s){return fD.format(new Date(parseDT(s)))}
function quand(s){var ms=parseDT(s),d=new Date(ms),t=new Date(),y=new Date(Date.now()-864e5);
  if(ymd(d)===ymd(t))return 'aujourd’hui '+fH.format(d);if(ymd(d)===ymd(y))return 'hier '+fH.format(d);return fdt(s)}
function nf(x,d){d=d==null?0:d;return new Intl.NumberFormat('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d}).format(x)}
function deg(x){return x==null?'—':nf(x,1)+' °C'}
function sum(a){return a.reduce(function(s,x){return s+(+x||0)},0)}
function avg(a){return a.length?sum(a)/a.length:null}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function num(v){if(v==null||String(v).trim()==='')return null;var n=parseFloat(String(v).replace(',','.').replace('−','-'));return isFinite(n)?n:null}
function sacsTxt(n){return nf(n,n%1?1:0)+' sac'+(Math.abs(n)>=2?'s':'')}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}

/* ==================================================================
   Stockage GitHub : un fichier donnees.json dans un dépôt privé.
   ================================================================== */
var CFGKEY='suivi-pellets-github', CACHEKEY='suivi-pellets-cache';
var cfg=null, sha=null, mode='connexion'; // connexion | chargement | pret
var enCours=false, attente=null, essais=0, dirty=false;
function b64enc(s){return btoa(unescape(encodeURIComponent(s)))}
function b64dec(s){return decodeURIComponent(escape(atob(String(s).replace(/\s/g,''))))}
function cfgId(){return cfg?cfg.owner+'/'+cfg.repo+'/'+cfg.path:''}
function moi(){return (cfg&&cfg.moi)||''}

/* conversion des données de la version 1.x vers la 2.0 */
function vide(){return {version:2,foyer:null,chargements:[],releves:[],supprimes:[],meteo:{}}}
function migrer(d){
  d=d||{};
  if(d.version===2){var o=vide();o.foyer=d.foyer||null;o.chargements=d.chargements||[];o.releves=d.releves||[];o.supprimes=d.supprimes||[];o.meteo=d.meteo||{};
    if(o.foyer){o.foyer.pieces=(o.foyer.pieces||[]).map(function(p){return {id:p.id,nom:p.nom,source:p.source||'saisie'}});o.foyer.extSource=o.foyer.extSource||'auto';o.foyer.historique=o.foyer.historique||[]}
    return o}
  var o2=vide(),p=d.profil;
  if(p){o2.foyer={nom:p.commune,commune:p.commune,cp:p.cp,lat:p.lat,lon:p.lon,extSource:'auto',
    pieces:(p.pieces&&p.pieces.length?p.pieces:[{id:'p1',nom:'Salon'}]).map(function(x){return {id:x.id,nom:x.nom,source:'saisie'}}),
    poidsSac:p.poidsSac||15,prixSac:p.prixSac||6.9,saison:p.saison||'Hiver 2026-2027',historique:p.historique||[],maj:p.maj||0}}
  (d.rem||[]).forEach(function(r){
    o2.chargements.push({id:r.id,t:r.t,sacs:r.sacs,par:r.par||'',saison:r.saison,maj:r.maj||0});
    var temps=r.temps?r.temps:(r.int!=null?{p1:r.int}:{});
    if(Object.keys(temps).length||r.ext!=null)o2.releves.push({id:'r-'+r.id,t:r.t,temps:temps,ext:r.ext!=null?r.ext:null,par:r.par||'',saison:r.saison,maj:r.maj||0});
  });
  o2.supprimes=d.supprimes||[];o2.meteo=d.meteo||{};
  return o2;
}

function ghUrl(){return 'https://api.github.com/repos/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo)+'/contents/'+cfg.path.split('/').map(encodeURIComponent).join('/')}
function gh(method,body){
  return fetch(ghUrl()+(method==='GET'?'?t='+Date.now():''),{method:method,cache:'no-store',headers:{'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body:body?JSON.stringify(body):undefined})
    .then(function(r){return r.text().then(function(t){var j=null;try{j=t?JSON.parse(t):null}catch(e){}if(!r.ok){var e=new Error((j&&j.message)||('HTTP '+r.status));e.status=r.status;throw e}return j})});
}
function depotExiste(){return fetch('https://api.github.com/repos/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo),{cache:'no-store',headers:{'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json'}}).then(function(r){return r.ok})}
function ghLire(){
  return gh('GET').then(function(j){

/* météo Open-Meteo */
function agreger(j){
  var out={},res={};if(!j||!j.hourly)return res;
  var t=j.hourly.time||[],v=j.hourly.temperature_2m||[];
  for(var i=0;i<t.length;i++){if(typeof v[i]!=='number')continue;var d=t[i].slice(0,10),o=out[d]||(out[d]={s:0,n:0,min:99,max:-99});o.s+=v[i];o.n++;if(v[i]<o.min)o.min=v[i];if(v[i]>o.max)o.max=v[i]}
  Object.keys(out).forEach(function(d){var o=out[d];if(o.n>=20)res[d]={min:Math.round(o.min*10)/10,max:Math.round(o.max*10)/10,moy:Math.round(o.s/o.n*10)/10}});
  return res;
}
var OpenMeteo={actualiser:function(){
  var R=S&&S.foyer;if(!R||R.lat==null)return Promise.resolve(false);
  var base='latitude='+R.lat+'&longitude='+R.lon+'&hourly=temperature_2m&timezone=Europe%2FParis',today=ymd(new Date());
  return fetch('https://api.open-meteo.com/v1/forecast?'+base+'&past_days=92&forecast_days=1').then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
    var h=new Date(),cle=today+'T'+p2(h.getHours())+':00',ix=(j.hourly.time||[]).indexOf(cle);
    if(ix>=0&&typeof j.hourly.temperature_2m[ix]==='number')S.actuelle=Math.round(j.hourly.temperature_2m[ix]*10)/10;
    var res=agreger(j),chg=false;
    Object.keys(res).forEach(function(d){if(d>today)return;var a=S.meteo[d],b=res[d];if(!a||a.min!==b.min||a.max!==b.max||a.moy!==b.moy){if(d<today)chg=true;S.meteo[d]=b}});
    var prem=S.chargements.concat(S.releves).map(function(r){return r.t.slice(0,10)}).sort()[0],lim=ymd(new Date(Date.now()-88*864e5));
    if(prem&&prem<lim){var manque=false;for(var d=new Date(parseDT(prem));ymd(d)<lim;d.setDate(d.getDate()+1)){if(!S.meteo[ymd(d)]){manque=true;break}}
      if(manque)return fetch('https://archive-api.open-meteo.com/v1/archive?'+base+'&start_date='+prem+'&end_date='+lim).then(function(r){return r.ok?r.json():null}).then(function(a){var ra=agreger(a);Object.keys(ra).forEach(function(d){if(!S.meteo[d]){S.meteo[d]=ra[d];chg=true}});return chg}).catch(function(){return chg})}
    return chg;
  }).catch(function(){ui.meteoKo=true;return false});
}};
function geocoder(commune,cp){
  return fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(commune)+'&count=20&language=fr&format=json').then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
    var L=(j&&j.results)||[];if(!L.length)return null;var fr=L.filter(function(x){return x.country_code==='FR'}),pool=fr.length?fr:L;
    var m=pool.filter(function(x){return (x.postcodes||[]).indexOf(cp)>=0})[0]||pool.filter(function(x){return (x.postcodes||[]).some(function(p){return p.slice(0,2)===String(cp).slice(0,2)})})[0]||pool[0];
    return {lat:Math.round(m.latitude*1000)/1000,lon:Math.round(m.longitude*1000)/1000,nom:m.name};
  });
}

/* connexion et démarrage */
function connecter(c){
  if(!c.owner||!c.repo||!c.token){ui.err='Remplissez les trois champs.';render();return}
  var old=lsGet(CFGKEY)||{};c.moi=old.moi||'';c.path=c.path||'donnees.json';
  cfg=c;ui.err='';mode='chargement';render();
  ghLire().then(function(r){
    lsSet(CFGKEY,cfg);appliquer(r.data);sha=r.sha;mode='pret';cacher(false);
    if(r.v1&&r.sha)enregistrer('Passage au format 2.0');
    render();Meteo.actualiser().then(function(chg){if(chg)sauver('Météo : '+(S.foyer?S.foyer.commune:''));render()});
  }).catch(function(e){
    mode='connexion';
    ui.err=e.status===401?'Clé refusée par GitHub : vérifiez-la ou créez-en une nouvelle.':(e.status===403?'Cette clé n’a pas le droit d’accéder au dépôt (Contents : Read and write).':(e.repo||e.status===404?'Dépôt introuvable : vérifiez le compte et le nom du dépôt.':'Pas de réponse de GitHub. Vérifiez votre connexion internet.'));
    render();
  });
}
function demarrer(){
  var inv=lireInvitation(),c0=lsGet(CFGKEY);
  if(inv&&!(c0&&c0.owner===inv.owner&&c0.repo===inv.repo&&c0.token===inv.token&&c0.path===inv.path)){lsDel(CACHEKEY);connecter(inv);return}
  if(!c0||!c0.token){mode='connexion';render();return}
  cfg=c0;var cache=lsGet(CACHEKEY);
  if(cache&&cache.cfgId===cfgId()&&cache.data){appliquer(migrer(cache.data));sha=cache.sha;mode='pret';setStatus('busy','Synchronisation…');render()}
  else{mode='chargement';render()}
  ghLire().then(function(r){
    var enAttente=!!(cache&&cache.pending&&cache.cfgId===cfgId()&&mode==='pret'&&S);
    // Un ancien téléphone (1.x) a réécrit le fichier : on récupère ce que ce téléphone-ci connaissait.
    var reparer=!!(r.v1&&r.sha&&cache&&cache.cfgId===cfgId()&&cache.data&&cache.data.version===2);
    appliquer(enAttente||reparer?(cache.sha===r.sha?donnees():fusion(r.data,donnees())):r.data);
    if(reparer&&!enAttente){enAttente=true}
    sha=r.sha;mode='pret';setStatus('ok','À jour');render();
    if(enAttente)enregistrer('Envoi des saisies faites hors ligne');else{cacher(false);if(r.v1&&r.sha)enregistrer('Passage au format 2.0')}
    Meteo.actualiser().then(function(chg){if(chg)sauver('Météo : '+(S.foyer?S.foyer.commune:''));render()});
  }).catch(function(e){
    if(mode==='pret'){setStatus('err',e.status===401||e.status===403?'Clé GitHub refusée':'Hors ligne : données du téléphone');dirty=true;return}
    mode='connexion';ui.err=e.status===401?'Clé refusée par GitHub : reconnectez-vous.':'Impossible de joindre GitHub. Vérifiez internet puis rechargez.';render();
  });
}

/* ---------- analyse ---------- */
function tempPiece(r,pc){return r.temps&&typeof r.temps[pc.id]==='number'?r.temps[pc.id]:null}
function intOf(r){var v=Object.keys(r.temps||{}).map(function(k){return r.temps[k]}).filter(function(x){return typeof x==='number'});return v.length?sum(v)/v.length:null}
function jourMeteo(t){var m=S.meteo[String(t).slice(0,10)];return m&&typeof m.moy==='number'?m:null}
function autoExt(a,b){var tot=0,w=0,cur=a;
  while(cur<b){var d=new Date(cur),next=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime(),end=Math.min(next,b),m=S.meteo[ymd(d)];
    if(m&&typeof m.moy==='number'){tot+=m.moy*(end-cur);w+=end-cur}cur=end}
  return w>0&&w>=(b-a)*0.5?tot/w:null}
function relevesSaison(){var s=F().saison;return S.releves.filter(function(r){return (r.saison||s)===s}).sort(function(a,b){return parseDT(a.t)-parseDT(b.t)})}
function chargementsSaison(){var s=F().saison;return S.chargements.filter(function(r){return (r.saison||s)===s}).sort(function(a,b){return parseDT(a.t)-parseDT(b.t)})}
function analyse(){
  var R=F(),src=R.extSource||'auto',rel=relevesSaison(),ch=chargementsSaison();
  var g=[];ch.forEach(function(c){var ms=parseDT(c.t),l=g[g.length-1];if(l&&ms-l.ms<6*36e5)l.sacs+=c.sacs;else g.push({ms:ms,t:c.t,sacs:c.sacs,par:c.par})});
  var relMs=rel.map(function(r){return {ms:parseDT(r.t),r:r}});
  var iv=[];
  for(var i=0;i<g.length-1;i++){var a=g[i].ms,b=g[i+1].ms,days=(b-a)/864e5;
    var dedans=relMs.filter(function(x){return x.ms>=a-36e5&&x.ms<=b+36e5});
    if(!dedans.length)dedans=relMs.filter(function(x){return Math.abs(x.ms-a)<12*36e5||Math.abs(x.ms-b)<12*36e5});
    var ints=dedans.map(function(x){return intOf(x.r)}).filter(function(v){return v!=null});
    var man=dedans.map(function(x){return x.r.ext}).filter(function(v){return v!=null});
    var au=autoExt(a,b),ext=src==='manuel'?avg(man):(src==='les2'?(man.length?avg(man):au):au);
    iv.push({from:g[i].t,to:g[i+1].t,days:days,sacs:g[i].sacs,rate:g[i].sacs/days,ext:ext,int:avg(ints)})}
  var total=sum(ch.map(function(c){return c.sacs}));
  var dIv=sum(iv.map(function(x){return x.days})),sIv=sum(iv.map(function(x){return x.sacs}));
  var withE=iv.filter(function(x){return x.ext!=null}),dE=sum(withE.map(function(x){return x.days}));
  var extMoy=dE?sum(withE.map(function(x){return x.ext*x.days}))/dE:null;
  var bands=BANDS.map(function(b){var xs=withE.filter(function(x){return x.ext>=b.lo&&x.ext<b.hi});var d=sum(xs.map(function(x){return x.days})),s=sum(xs.map(function(x){return x.sacs}));return {lab:b.lab,days:d,sacs:s,rate:d?s/d:null}});
  var reg=null;
  if(withE.length>=3){var mx=extMoy,my=sum(withE.map(function(x){return x.rate*x.days}))/dE,sxx=0,sxy=0;
    withE.forEach(function(x){sxx+=x.days*(x.ext-mx)*(x.ext-mx);sxy+=x.days*(x.ext-mx)*(x.rate-my)});if(sxx>0){var bb=sxy/sxx;reg={a:my-bb*mx,b:bb}}}

  var ps=pieces(),ref0=ps[0];

    rel.forEach(function(r){var v=tempPiece(r,pc);if(v==null)return;all.push(v);var e=r.ext!=null?r.ext:(jourMeteo(r.t)||{}).moy;if(e!=null)(e<5?froid:doux).push(v);
      if(i>0){var v0=tempPiece(r,ref0);if(v0!=null)ec.push(v-v0)}});
    return {nom:pc.nom,n:all.length,moy:avg(all),min:all.length?Math.min.apply(null,all):null,max:all.length?Math.max.apply(null,all):null,froid:avg(froid),doux:avg(doux),ecart:i>0?avg(ec):null}});
  return {rel:rel,ch:ch,iv:iv,total:total,rate:dIv?sIv/dIv:null,extMoy:extMoy,bands:bands,reg:reg,sig:sig,salles:salles,
    first:g[0]||null,last:g[g.length-1]||null,cout:total*R.prixSac,kg:total*R.poidsSac,dernierReleve:rel[rel.length-1]||null}
}
function predict(reg,t){return Math.max(0,reg.a+reg.b*t)}
function dehorsMaintenant(){
  var src=F().extSource||'auto',rel=relevesSaison().filter(function(r){return r.ext!=null}),der=rel[rel.length-1];
  if(src==='manuel')return der?{v:der.ext,note:'noté '+quand(der.t)}:{v:null,note:'à noter au prochain relevé'};

/* ---------- graphiques ---------- */
function niceTop(v){var s=v>4?1:(v>2?0.5:0.25);return {top:Math.max(s,Math.ceil(v*1.15/s)*s),step:s}}
function scatterSVG(A){
  var pts=A.iv.filter(function(x){return x.ext!=null});
  if(pts.length<2)return '<p class="empty">Le nuage de points apparaît après 3 chargements, dès que la température extérieure est connue.</p>';

  var mn=Math.min.apply(null,pts.map(function(x){return x.ext})),mx=Math.max.apply(null,pts.map(function(x){return x.ext}));
  var lo=Math.min(-5,Math.floor(mn/5)*5),hi=Math.max(15,Math.ceil(mx/5)*5);
  var yt=niceTop(Math.max.apply(null,pts.map(function(x){return x.rate})));
  var X=function(v){return L+(W-L-Rr)*(v-lo)/(hi-lo)},Y=function(v){return T+(H-T-B)*(1-v/yt.top)};
  var g='<defs><clipPath id="cp"><rect x="'+L+'" y="'+T+'" width="'+(W-L-Rr)+'" height="'+(H-T-B)+'"/></clipPath></defs>';
  for(var v=0;v<=yt.top+1e-9;v+=yt.step)g+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="13" fill="var(--muted)">'+nf(v,yt.step<1?2:0)+'</text>';
  for(var t=lo;t<=hi;t+=5)g+='<line x1="'+X(t)+'" x2="'+X(t)+'" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--line)" stroke-dasharray="'+(t===0?'0':'2 4')+'"/><text x="'+X(t)+'" y="'+(H-B+17)+'" text-anchor="middle" font-size="13" fill="var(--muted)">'+nf(t)+' °C</text>';
  g+='<text x="'+L+'" y="'+(T-3)+'" font-size="13" fill="var(--muted)">sacs par jour</text>';
  if(A.reg)g+='<line clip-path="url(#cp)" x1="'+X(lo)+'" y1="'+Y(A.reg.a+A.reg.b*lo)+'" x2="'+X(hi)+'" y2="'+Y(A.reg.a+A.reg.b*hi)+'" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>';
  pts.forEach(function(x){g+='<circle cx="'+X(x.ext).toFixed(1)+'" cy="'+Y(x.rate).toFixed(1)+'" r="8" fill="var(--accent)" fill-opacity="0.82" stroke="var(--surface)" stroke-width="1.5"><title>'+fds(x.from)+' : '+nf(x.rate,2)+' sac/j à '+deg(x.ext)+'</title></circle>'});
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Sacs par jour selon la température extérieure">'+g+'</svg>';
}
function timelineSVG(A){
  var iv=A.iv.slice(-30);if(iv.length<2)return '';
  var W=700,H=240,L=46,Rr=46,T=16,B=30;

  var ex=iv.filter(function(x){return x.ext!=null}).map(function(x){return x.ext});
  var tlo=Math.min(-5,Math.floor((ex.length?Math.min.apply(null,ex):0)/5)*5),thi=Math.max(15,Math.ceil((ex.length?Math.max.apply(null,ex):10)/5)*5);

  if(path)g+='<path d="'+path+'" fill="none" stroke="var(--cold)" stroke-width="2"/>';
  return '<div class="legend"><span><i style="background:var(--accent)"></i>Sacs par jour</span><span><i style="background:var(--cold)"></i>Dehors</span></div><div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Consommation et température au fil de la saison">'+g+'</svg></div>';

function csv(A){
  var ps=pieces(),c=function(v){return v==null?'':String(Math.round(v*100)/100).replace('.',',')};
  var l=['type;date;sacs;'+ps.map(function(pc){return '"'+pc.nom.replace(/"/g,'')+'"'}).join(';')+';dehors_note;dehors_meteo;par'];
  A.ch.forEach(function(x){l.push(['chargement',x.t.replace('T',' '),c(x.sacs)].concat(ps.map(function(){return ''})).concat(['','','"'+(x.par||'')+'"']).join(';'))});
  A.rel.forEach(function(r){var m=jourMeteo(r.t);l.push(['temperatures',r.t.replace('T',' '),''].concat(ps.map(function(pc){return c(tempPiece(r,pc))})).concat([c(r.ext),m?c(m.moy):'','"'+(r.par||'')+'"']).join(';'))});
  return l.join('\n');
}


/* ==================================================================
   Fond animé : neige (froid dehors) en haut, braises (poêle) en bas.
   Plus il fait froid, plus il neige. Coupé si l'appareil demande moins d'animations.
   ================================================================== */
var Fond=(function(){
  var cv=document.getElementById('fond'),ctx=cv&&cv.getContext&&cv.getContext('2d'),W=0,H=0,dpr=1,flocons=[],braises=[],actif=false,raf=null,der=0,froid=0.5,force=1,visible=false;
  var calme=false;try{calme=window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
  function niveau(){var n=(typeof cfg!=='undefined'&&cfg&&cfg.anim)||(calme?'off':'normale');return n}
  function facteur(){return {douce:0.6,normale:1,vive:1.8}[niveau()]||0}
  function taille(){if(!cv)return;dpr=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
  function flocon(y){return {x:Math.random()*W,y:y==null?-10:y,r:1.4+Math.random()*3.4,v:0.35+Math.random()*0.8,o:Math.random()*Math.PI*2,a:0.45+Math.random()*0.5}}
  function braise(y){return {x:Math.random()*W,y:y==null?H+5:y,r:1.2+Math.random()*2.6,v:0.45+Math.random()*0.9,o:Math.random()*Math.PI*2,vie:1}}
  function peupler(){var f=facteur(),cap=Math.min(1,700/Math.sqrt(W*H));var nf=Math.round((W*H/5200)*(0.55+froid*0.9)*f*Math.max(cap,0.45)),nb=Math.round((W*H/13000)*f*Math.max(cap,0.45));
    flocons=[];braises=[];for(var i=0;i<nf;i++)flocons.push(flocon(Math.random()*H));for(var j=0;j<nb;j++)braises.push(braise(H*0.45+Math.random()*H*0.55))}
  function couleurs(){var cs=getComputedStyle(document.documentElement);return {neige:cs.getPropertyValue('--snow').trim()||'#ffffff',braise:cs.getPropertyValue('--accent').trim()||'#d9611a'}}
  function dessiner(t){
    raf=requestAnimationFrame(dessiner);if(t-der<33)return;var dt=Math.min(3,(t-der)/16.7);der=t;
    ctx.clearRect(0,0,W,H);var c=couleurs();
    ctx.fillStyle=c.neige;
    for(var i=0;i<flocons.length;i++){var f=flocons[i];f.y+=f.v*dt;f.o+=0.02*dt;f.x+=Math.sin(f.o)*0.35*dt;
      if(f.y>H*0.8){f.a-=0.01*dt}if(f.y>H+5||f.a<=0){flocons[i]=flocon()}
      ctx.globalAlpha=Math.max(0,f.a);ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.283);ctx.fill()}
    ctx.fillStyle=c.braise;
    for(var j=0;j<braises.length;j++){var b=braises[j];b.y-=b.v*dt;b.o+=0.05*dt;b.x+=Math.sin(b.o)*0.4*dt;b.vie-=0.0011*dt*(1+b.v);
      if(b.vie<=0||b.y<H*0.2){braises[j]=braise()}
      var al=Math.max(0,b.vie);ctx.globalAlpha=al*0.18;ctx.beginPath();ctx.arc(b.x,b.y,b.r*2.6,0,6.283);ctx.fill();
      ctx.globalAlpha=al*0.85;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.283);ctx.fill()}
    ctx.globalAlpha=1}
  function demarrer(){if(!ctx||!facteur()||actif)return;actif=true;der=0;raf=requestAnimationFrame(dessiner)}
  function arreter(){actif=false;if(raf)cancelAnimationFrame(raf);raf=null}
  window.addEventListener('resize',function(){taille();peupler()});
  document.addEventListener('visibilitychange',function(){if(document.hidden)arreter();else if(visible)demarrer()});
  if(cv){taille();peupler()}
  return {
    montrer:function(oui,tempDehors){if(!cv)return;
      if(tempDehors!=null){var nv=Math.max(0,Math.min(1,(12-tempDehors)/14));if(Math.abs(nv-froid)>0.08){froid=nv;peupler()}}
      visible=oui&&facteur()>0;cv.style.opacity=visible?'1':'0';if(visible)demarrer();else{arreter();ctx&&ctx.clearRect(0,0,W,H)}},
    regler:function(){arreter();peupler();},
    systemeCalme:function(){return calme}
  };
})();

/* ---------- rendu ---------- */
function render(){
  var e=ecran();
  if(mode==='connexion')e='bienvenue';else if(mode==='chargement'||!S)e='attente';else if(!S.foyer)e='foyer';
  if(e==='attente'){app.innerHTML=vueChargementDonnees();Fond.montrer(true,null);return}
  var v={bienvenue:vueBienvenue,foyer:vueFoyer,accueil:vueAccueil,temperatures:vueTemperatures,chargement:vueChargement,details:vueDetails,reglages:vueReglages}[e]||vueAccueil;
  app.innerHTML=v();
  var dh=null;try{dh=(e==='accueil'&&S&&S.foyer)?dehorsMaintenant().v:null}catch(err){}
  document.documentElement.classList.toggle('anim-on',!!(cfg&&cfg.anim&&cfg.anim!=='off'));document.documentElement.classList.toggle('anim-off',!!(cfg&&cfg.anim==='off'));
  Fond.montrer(e==='accueil'||e==='bienvenue',dh);
}
var toastT=null;
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},2600)}
function copier(id){var t=document.getElementById(id);try{navigator.clipboard.writeText(t.value).then(function(){toast('Copié')},function(){t.select();toast('Sélectionné : faites Copier')})}catch(e){t.select();toast('Sélectionné : faites Copier')}}

app.addEventListener('click',function(ev){
  var go=ev.target.closest('[data-go]');if(go){ev.preventDefault();aller(go.getAttribute('data-go'));return}
  var b=ev.target.closest('[data-a]');if(!b)return;var a=b.getAttribute('data-a');
  if(a==='anim'){cfg.anim=b.getAttribute('data-n');lsSet(CFGKEY,cfg);Fond.regler();render();toast('Animation : '+b.textContent);return}
  if(a==='logout'){lsDel(CFGKEY);lsDel(CACHEKEY);cfg=null;S=null;sha=null;mode='connexion';ui.invite=false;aller('accueil')}
  else if(a==='commune'){ui.commune=!ui.commune;render()}
  else if(a==='plus'||a==='moins'||a==='set'){ui.charge=a==='set'?+b.getAttribute('data-n'):Math.max(0.5,Math.min(10,ui.charge+(a==='plus'?0.5:-0.5)));var cv=document.getElementById('cv');if(cv){cv.textContent=nf(ui.charge,ui.charge%1?1:0);cv.nextSibling.textContent=ui.charge>=2?'sacs':'sac';cv.classList.remove('pop');void cv.offsetWidth;cv.classList.add('pop')}}
  else if(a==='heure'){ui.autreHeure=true;render()}
  else if(a==='onglet'){ui.onglet=b.getAttribute('data-o');render()}
  else if(a==='del'){var k=b.getAttribute('data-k'),id=b.getAttribute('data-id');S[k]=S[k].filter(function(x){return x.id!==id});(S.supprimes=S.supprimes||[]).push(id);sauver('Suppression');render();toast('Supprimé')}
  else if(a==='csv'){ui.csv=!ui.csv;render()}
  else if(a==='copycsv')copier('csv');
  else if(a==='copylien')copier('lien');
  else if(a==='share'){try{navigator.share({title:'Suivi pellets',text:'Rejoins notre suivi des pellets :',url:document.getElementById('lien').value}).catch(function(){})}catch(e){copier('lien')}}
  else if(a==='invite'){ui.invite=!ui.invite;render()}
  else if(a==='pdel'){var pid=b.getAttribute('data-id');if(pieces().length<2)return;F().pieces=pieces().filter(function(p){return p.id!==pid});F().maj=Date.now();sauver('Pièce retirée');render();toast('Pièce retirée')}
  else if(a==='close1'){ui.confirmClose=true;render()}
  else if(a==='close0'){ui.confirmClose=false;render()}
  else if(a==='close2'){var A=analyse(),R=F();ui.confirmClose=false;
    R.historique=(R.historique||[]).concat([{label:R.saison,sacs:A.total,jours:A.first&&A.last?Math.round((A.last.ms-A.first.ms)/864e5+1):0,ext:A.extMoy!=null?Math.round(A.extMoy*10)/10:null}]);
    var m=R.saison.match(/(\d{4})\D+(\d{4})/);R.saison=m?R.saison.replace(m[0],(+m[1]+1)+'-'+(+m[2]+1)):R.saison+' (suite)';R.maj=Date.now();sauver('Clôture de la saison');render();toast('Nouvelle saison : '+R.saison)}
});
app.addEventListener('change',function(ev){
  var el=ev.target;
  if(el.name==='extSource'){F().extSource=el.value;F().maj=Date.now();sauver('Source de la température extérieure');toast('Température extérieure : '+EXT_SOURCES.filter(function(o){return o.id===el.value})[0].lab);return}
  if(el.getAttribute('data-moi')){cfg.moi=el.value.trim();lsSet(CFGKEY,cfg);toast('Prénom enregistré');return}
  var pr=el.getAttribute('data-pren');if(pr){var v=el.value.trim();if(!v)return;pieces().forEach(function(p){if(p.id===pr)p.nom=v});F().maj=Date.now();sauver('Pièce renommée');toast('Pièce renommée');return}
  var r=el.getAttribute('data-r');if(r){var old=F().saison;if(el.type==='text'){var t=el.value.trim();if(t)F()[r]=t}else{var n=num(el.value);if(n!=null&&n>0)F()[r]=n}
    if(r==='saison'&&old!==F().saison){var now=Date.now();S.chargements.concat(S.releves).forEach(function(x){if((x.saison||old)===old){x.saison=F().saison;x.maj=now}})}
    F().maj=Date.now();sauver('Réglages');toast('Enregistré')}
});
app.addEventListener('submit',function(ev){
  ev.preventDefault();var f=ev.target;
  if(f.id==='fCharge'){var t=f.t&&f.t.value?f.t.value:nowDT();
    S.chargements.push({id:newId(),t:t,sacs:ui.charge,par:moi(),saison:F().saison,maj:Date.now()});sauver('Chargement : '+sacsTxt(ui.charge)+(moi()?' par '+moi():''));
    var n=ui.charge;ui.charge=1;ui.autreHeure=false;aller('accueil');toast('🔥 '+sacsTxt(n)+' noté'+(n>=2?'s':'')+', merci !');
    var c=document.getElementById('compteur');if(c){c.classList.add('pop')}return}
  if(f.id==='fTemp'){var temps={},nb=0;Array.prototype.forEach.call(f.querySelectorAll('[data-piece]'),function(el){var v=num(el.value);if(v!=null&&v>-30&&v<45){temps[el.getAttribute('data-piece')]=Math.round(v*10)/10;nb++}});
    var ext=f.ext?num(f.ext.value):null;
    if(!nb&&ext==null){toast('Notez au moins une température');return}
    S.releves.push({id:newId(),t:nowDT(),temps:temps,ext:ext,par:moi(),saison:F().saison,maj:Date.now()});sauver('Températures'+(moi()?' par '+moi():''));
    aller('accueil');toast('🌡️ '+nb+' pièce'+(nb>1?'s':'')+' enregistrée'+(nb>1?'s':''));return}
  if(f.id==='fPiece'){var nom=f.nom.value.trim();if(!nom)return;var mx=0;pieces().forEach(function(p){var k=parseInt(String(p.id).slice(1),10);if(k>mx)mx=k});
    F().pieces.push({id:'p'+(mx+1)+'x'+Date.now().toString(36).slice(-3),nom:nom,source:'saisie'});F().maj=Date.now();sauver('Pièce ajoutée : '+nom);render();toast('Pièce ajoutée');return}
  if(f.id==='fFoyer'||f.id==='fCommune'){
    var com=f.commune.value.trim(),cp=f.cp.value.trim().toUpperCase();if(!com||!cp)return;
    var btn=f.querySelector('button[type=submit]');btn.disabled=true;btn.textContent='Recherche de la commune…';
    geocoder(com,cp).then(function(g){
      if(!g){ui.err='Commune introuvable. Essayez sans « sur-Mer » ou sans tirets (ex. Etaples).';btn.disabled=false;render();toast('Commune introuvable');return}
      var nouveau=!S.foyer;
      if(nouveau){var noms=(f.pieces?f.pieces.value:'Salon').split(',').map(function(x){return x.trim()}).filter(Boolean);
        S.foyer={nom:com,commune:com,cp:cp,lat:g.lat,lon:g.lon,extSource:'auto',pieces:(noms.length?noms:['Salon']).map(function(n,i){return {id:'p'+(i+1),nom:n,source:'saisie'}}),poidsSac:15,prixSac:6.9,saison:'Hiver 2026-2027',historique:[],maj:Date.now()}}
      else{var chg=S.foyer.lat!==g.lat||S.foyer.lon!==g.lon;S.foyer.commune=com;S.foyer.cp=cp;S.foyer.lat=g.lat;S.foyer.lon=g.lon;S.foyer.maj=Date.now();if(chg)S.meteo={};ui.commune=false}
      ui.err='';sauver('Foyer : '+com);aller('accueil');toast(nouveau?'Foyer créé !':'Commune enregistrée');
      Meteo.actualiser().then(function(c){if(c)sauver('Météo : '+com);render()});
    }).catch(function(){ui.err='Impossible de chercher la commune (réseau ?).';btn.disabled=false;render()});
    return}
  if(f.id==='fConn'){connecter({owner:f.owner.value.trim(),repo:f.repo.value.trim(),path:'donnees.json',token:f.token.value.trim()});return}
  if(f.id==='fCode'){var v=f.code.value.trim();if(v.indexOf('#connexion=')>=0)v=decodeURIComponent(v.split('#connexion=')[1].split('&')[0]);
    try{var o=JSON.parse(b64dec(v));connecter({owner:o.o,repo:o.r,path:o.p||'donnees.json',token:o.t})}catch(err){ui.err='Ce lien ou ce code n’est pas valide. Recopiez-le en entier.';render()}return}
});

document.getElementById('version').textContent='Suivi pellets · version '+VERSION+' · '+VERSION_DATE;
demarrer();
})();
